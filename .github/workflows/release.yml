name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: dist:mac
          - os: windows-latest
            task: dist:win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Шрифты не лежат в репозитории, но нужны и тестам, и сборке.
      - run: pnpm fonts
      - run: pnpm test
      - run: pnpm ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: konspekt-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      # Публичная страница загрузки: обычному пользователю артефакты Actions
      # недоступны без входа в GitHub, а файлы в Releases качает кто угодно.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/*.dmg
            release/*.exe
          generate_release_notes: true
